<svg xmlns="http://www.w3.org/2000/svg" width="960" height="238" viewBox="0 213 1200 297" role="img" aria-labelledby="title desc">
  <title id="title">Bound retries, then use a DLQ</title><desc id="desc">Move a failed record durably before advancing the main Consumer position</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><g filter="url(#shadow)"><rect x="60" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="60" y="250" width="237" height="44" rx="8" fill="#a70d18"/><text x="178.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">MAIN TOPIC</text><text x="178.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">offset 101 fails</text><text x="178.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">later records wait</text></g><line x1="297" y1="360" x2="333" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="341" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="341" y="250" width="237" height="44" rx="8" fill="#275d91"/><text x="459.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">RETRY TOPIC</text><text x="459.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">attempt + delay</text><text x="459.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">bounded retries</text></g><line x1="578" y1="360" x2="614" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="622" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/><rect x="622" y="250" width="237" height="44" rx="8" fill="#187769"/><text x="740.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">PROCESS AGAIN</text><text x="740.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">temporary issue?</text><text x="740.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">rate limited</text></g><line x1="859" y1="360" x2="895" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="903" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="903" y="250" width="237" height="44" rx="8" fill="#a70d18"/><text x="1021.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">DEAD LETTER</text><text x="1021.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">final failure</text><text x="1021.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">operator review</text></g></g></svg>
