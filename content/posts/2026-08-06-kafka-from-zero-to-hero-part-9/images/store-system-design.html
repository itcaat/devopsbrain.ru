<script>
const canvas=document.querySelector('#canvas'),scene=document.querySelector('#scene'),svg=document.querySelector('svg');let scale=1,x=0,y=0,drag=null;
function draw(){scene.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')'}
function fit(){scale=Math.min((canvas.clientWidth-24)/2100,(canvas.clientHeight-24)/1200);x=(canvas.clientWidth-2100*scale)/2;y=(canvas.clientHeight-1200*scale)/2;draw()}
function zoom(f,cx=canvas.clientWidth/2,cy=canvas.clientHeight/2){const next=Math.max(.1,Math.min(3,scale*f));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;draw()}
document.querySelector('#fit').onclick=fit;document.querySelector('#in').onclick=()=>zoom(1.3);document.querySelector('#out').onclick=()=>zoom(1/1.3);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.onpointerdown=e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;x+=e.clientX-drag.x;y+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
const motion=document.querySelector('#motion');function state(){const paused=svg.animationsPaused();motion.textContent=paused?'▶':'Ⅱ';motion.title=paused?'Play animation':'Pause animation';motion.setAttribute('aria-label',motion.title);motion.setAttribute('aria-pressed',String(paused))}
motion.onclick=()=>{svg.animationsPaused()?svg.unpauseAnimations():svg.pauseAnimations();state()};if(matchMedia('(prefers-reduced-motion: reduce)').matches)svg.pauseAnimations();state();window.addEventListener('resize',fit);fit();
</script></html>
