<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Page Cache serves two independent paths</title>
  <desc id="desc">Kafka writes into the operating system Page Cache. The operating system can flush pages to disk while Kafka sends cached data to a network socket.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f8f6f1"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="60" y="82" fill="#172033" font-size="46" font-weight="760">Page Cache serves</text>
    <text x="493" y="82" fill="#a70d18" font-size="46" font-weight="760">two paths</text>
    <text x="62" y="122" fill="#5c6069" font-size="21" font-weight="500">Disk flush and network transfer can progress independently</text>
    <g filter="url(#shadow)">
      <rect x="65" y="275" width="245" height="210" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="65" y="275" width="245" height="46" rx="8" fill="#a70d18"/>
      <text x="187.5" y="305" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">KAFKA PROCESS</text>
      <text x="187.5" y="369" text-anchor="middle" fill="#172033" font-size="20" font-weight="720">append records</text>
      <text x="187.5" y="400" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">write to a file</text>
    </g>
    <path d="M310 380 H390" fill="none" stroke="#275d91" stroke-width="4" opacity=".58" marker-end="url(#arrowBlue)"/>
    <g filter="url(#shadow)">
      <rect x="400" y="250" width="270" height="260" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/>
      <rect x="400" y="250" width="270" height="48" rx="8" fill="#275d91"/>
      <text x="535" y="281" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">OS PAGE CACHE</text>
      <text x="535" y="365" text-anchor="middle" fill="#172033" font-size="21" font-weight="720">RAM-backed pages</text>
      <text x="535" y="398" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">recent writes stay hot</text>
    </g>
    <path d="M670 330 C730 330 744 252 805 252" fill="none" stroke="#275d91" stroke-width="4" opacity=".5" marker-end="url(#arrowBlue)"/>
    <text x="733" y="286" text-anchor="middle" fill="#275d91" font-size="14" font-weight="700">async flush</text>
    <path d="M670 430 C730 430 744 508 805 508" fill="none" stroke="#187769" stroke-width="4" opacity=".5" marker-end="url(#arrowGreen)"/>
    <text x="735" y="476" text-anchor="middle" fill="#187769" font-size="14" font-weight="700">sendfile()</text>
    <g filter="url(#shadow)">
      <rect x="815" y="180" width="315" height="165" rx="8" fill="#fffdfa" stroke="#8c94a3" stroke-width="3"/>
      <rect x="815" y="180" width="315" height="44" rx="8" fill="#8c94a3"/>
      <text x="972.5" y="209" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">DISK</text>
      <text x="972.5" y="268" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">persistent segments</text>
      <text x="972.5" y="297" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">written in the background</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="815" y="425" width="315" height="165" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/>
      <rect x="815" y="425" width="315" height="44" rx="8" fill="#187769"/>
      <text x="972.5" y="454" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">NETWORK SOCKET</text>
      <text x="972.5" y="513" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">Consumer reads</text>
      <text x="972.5" y="542" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">less user-space copying</text>
    </g>
  </g>
</svg>
