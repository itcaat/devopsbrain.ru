<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Partitions create parallel lanes</title>
  <desc id="desc">Three partitions are hosted by different brokers and read by different consumers in parallel.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker>
  </defs>
  <rect width="1200" height="610" fill="#f8f6f1"/>
  <rect width="1200" height="610" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="60" y="82" fill="#172033" font-size="46" font-weight="760">Partitions create</text>
    <text x="493" y="82" fill="#a70d18" font-size="46" font-weight="760">parallel lanes</text>
    <text x="62" y="122" fill="#5c6069" font-size="21" font-weight="500">Each lane keeps its own order while the group processes several lanes at once</text>

    <g filter="url(#shadow)">
      <path d="M68 185H382Q390 185 390 193V537Q390 545 382 545H68Q60 545 60 537V193Q60 185 68 185Z" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="60" y="185" width="330" height="48" rx="8" fill="#a70d18"/>
      <text x="225" y="217" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">BROKER 1 · LANE P0</text>
      <rect x="105" y="270" width="240" height="58" rx="7" fill="#fff7f5" stroke="#a70d18" stroke-width="2"/>
      <text x="225" y="295" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Partition 0</text>
      <text x="225" y="316" text-anchor="middle" fill="#5c6069" font-size="13" font-weight="550">ordered log</text>
      <path d="M225 328V425" stroke="#a70d18" stroke-width="3" marker-end="url(#arrowRed)" opacity=".55"/>
      <text x="245" y="385" fill="#a70d18" font-size="13" font-weight="650">fetch</text>
      <rect x="105" y="438" width="240" height="62" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/>
      <text x="225" y="465" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Consumer A</text>
      <text x="225" y="487" text-anchor="middle" fill="#a70d18" font-size="13" font-weight="650">reads independently</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M443 185H757Q765 185 765 193V537Q765 545 757 545H443Q435 545 435 537V193Q435 185 443 185Z" fill="#fffdfa" stroke="#275d91" stroke-width="3"/>
      <rect x="435" y="185" width="330" height="48" rx="8" fill="#275d91"/>
      <text x="600" y="217" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">BROKER 2 · LANE P1</text>
      <rect x="480" y="270" width="240" height="58" rx="7" fill="#f5f8fb" stroke="#275d91" stroke-width="2"/>
      <text x="600" y="295" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Partition 1</text>
      <text x="600" y="316" text-anchor="middle" fill="#5c6069" font-size="13" font-weight="550">ordered log</text>
      <path d="M600 328V425" stroke="#275d91" stroke-width="3" marker-end="url(#arrowBlue)" opacity=".55"/>
      <text x="620" y="385" fill="#275d91" font-size="13" font-weight="650">fetch</text>
      <rect x="480" y="438" width="240" height="62" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/>
      <text x="600" y="465" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Consumer B</text>
      <text x="600" y="487" text-anchor="middle" fill="#275d91" font-size="13" font-weight="650">reads independently</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M818 185H1132Q1140 185 1140 193V537Q1140 545 1132 545H818Q810 545 810 537V193Q810 185 818 185Z" fill="#fffdfa" stroke="#187769" stroke-width="3"/>
      <rect x="810" y="185" width="330" height="48" rx="8" fill="#187769"/>
      <text x="975" y="217" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">BROKER 3 · LANE P2</text>
      <rect x="855" y="270" width="240" height="58" rx="7" fill="#f4faf8" stroke="#187769" stroke-width="2"/>
      <text x="975" y="295" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Partition 2</text>
      <text x="975" y="316" text-anchor="middle" fill="#5c6069" font-size="13" font-weight="550">ordered log</text>
      <path d="M975 328V425" stroke="#187769" stroke-width="3" marker-end="url(#arrowGreen)" opacity=".55"/>
      <text x="995" y="385" fill="#187769" font-size="13" font-weight="650">fetch</text>
      <rect x="855" y="438" width="240" height="62" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/>
      <text x="975" y="465" text-anchor="middle" fill="#172033" font-size="17" font-weight="720">Consumer C</text>
      <text x="975" y="487" text-anchor="middle" fill="#187769" font-size="13" font-weight="650">reads independently</text>
    </g>
  </g>
</svg>
