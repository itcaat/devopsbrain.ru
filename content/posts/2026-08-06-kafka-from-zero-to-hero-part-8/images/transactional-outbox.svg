ill="#187769"/><text x="740.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">PUBLISHER</text><text x="740.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">send · retry</text><text x="740.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">mark published</text></g><line x1="859" y1="360" x2="895" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="903" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="903" y="250" width="237" height="44" rx="8" fill="#a70d18"/><text x="1021.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">KAFKA</text><text x="1021.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">OrderCreated</text><text x="1021.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">Key: orderId</text></g></g></svg>