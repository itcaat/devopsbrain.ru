<svg xmlns="http://www.w3.org/2000/svg" width="960" height="296" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Kafka: Reliable delivery</title><desc id="desc">Outbox, producer retries, commit order, and idempotent processing</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" text-anchor="start" fill="#172033" font-size="50" font-weight="760">Kafka: </text><text x="249" y="82" text-anchor="start" fill="#a70d18" font-size="50" font-weight="760">Reliable delivery</text><g transform="translate(0 -60)"><g filter="url(#shadow)"><rect x="60" y="210" width="237" height="180" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="60" y="210" width="237" height="44" rx="8" fill="#a70d18"/><text x="178.5" y="239" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">DATABASE</text><text x="178.5" y="292" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">order + outbox</text><text x="178.5" y="321" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">one transaction</text></g><line x1="297" y1="300" x2="333" y2="300" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="341" y="210" width="237" height="180" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="341" y="210" width="237" height="44" rx="8" fill="#275d91"/><text x="459.5" y="239" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">PRODUCER</text><text x="459.5" y="292" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">retry safely</text><text x="459.5" y="321" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">stable eventId</text></g><line x1="578" y1="300" x2="614" y2="300" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="622" y="210" width="237" height="180" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="622" y="210" width="237" height="44" rx="8" fill="#a70d18"/><text x="740.5" y="239" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">KAFKA</text><text x="740.5" y="292" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">replicated record</text><text x="740.5" y="321" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">acks=all</text></g><line x1="859" y1="300" x2="895" y2="300" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="903" y="210" width="237" height="180" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/><rect x="903" y="210" width="237" height="44" rx="8" fill="#187769"/><text x="1021.5" y="239" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">CONSUMER</text><text x="1021.5" y="292" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">process then commit</text><text x="1021.5" y="321" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">deduplicate</text></g></g></g></svg>
