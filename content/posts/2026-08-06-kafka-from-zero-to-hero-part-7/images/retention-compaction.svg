<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Retention and Compaction serve different goals</title><desc id="desc">Delete limits history; compaction preserves the latest value for each key</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" text-anchor="start" fill="#172033" font-size="46" font-weight="760">Retention and Compaction </text><text x="676" y="82" text-anchor="start" fill="#a70d18" font-size="46" font-weight="760">serve different goals</text><text x="62" y="122" text-anchor="start" fill="#5c6069" font-size="21" font-weight="500">Delete limits history; compaction preserves the latest value for each key</text><g filter="url(#shadow)"><rect x="70" y="210" width="500" height="390" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="210" width="500" height="48" rx="8" fill="#a70d18"/><text x="320" y="242" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">cleanup.policy=delete</text><rect x="108" y="302" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="130" y="327" text-anchor="start" fill="#172033" font-size="17" font-weight="720">History</text><text x="510" y="327" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">time / size</text><text x="130" y="348" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">old segments are removed</text><rect x="108" y="384" width="424" height="58" rx="7" fill="#fff" stroke="#a70d18" stroke-width="3"/><text x="130" y="409" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Replay</text><text x="510" y="409" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">bounded</text><text x="130" y="430" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">only retained records remain</text><rect x="108" y="466" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="130" y="491" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Best for</text><text x="510" y="491" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">event history</text><text x="130" y="512" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">orders and audit streams</text></g><g filter="url(#shadow)"><rect x="630" y="210" width="500" height="390" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="630" y="210" width="500" height="48" rx="8" fill="#275d91"/><text x="880" y="242" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">cleanup.policy=compact</text><rect x="668" y="302" width="424" height="58" rx="7" fill="#fff" stroke="#275d91" stroke-width="3"/><text x="690" y="327" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Key product-1732</text><text x="1070" y="327" text-anchor="end" fill="#275d91" font-size="14" font-weight="700">latest value</text><text x="690" y="348" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">older versions may disappear</text><rect x="668" y="384" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="690" y="409" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Tombstone</text><text x="1070" y="409" text-anchor="end" fill="#275d91" font-size="14" font-weight="700">value = null</text><text x="690" y="430" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">signals deletion</text><rect x="668" y="466" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="690" y="491" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Best for</text><text x="1070" y="491" text-anchor="end" fill="#275d91" font-size="14" font-weight="700">current state</text><text x="690" y="512" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">catalog cache or profiles</text></g></g></svg>