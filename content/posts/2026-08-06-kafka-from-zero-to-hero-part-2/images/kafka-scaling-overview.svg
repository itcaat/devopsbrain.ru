<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Partitions and Consumer Groups</title><desc id="desc">A topic is split into three ordered partitions distributed across brokers and assigned to consumers in one group.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="40" font-weight="760">Kafka: <tspan fill="#a70d18">Partitions &amp; Consumer Groups</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Parallelism, ordering, and horizontal scaling</text>
    <g filter="url(#shadow)"><rect x="70" y="244" width="700" height="390" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="244" width="700" height="48" rx="8" fill="#172033"/><text x="98" y="276" fill="#fff" font-size="17" font-weight="750">TOPIC · orders.events</text><text x="738" y="276" text-anchor="end" fill="#c8ced8" font-size="13" font-weight="650">3 ordered logs</text><g fill="#fffdfa" stroke-width="3"><rect x="112" y="330" width="616" height="74" rx="7" stroke="#a70d18"/><rect x="112" y="430" width="616" height="74" rx="7" stroke="#275d91"/><rect x="112" y="530" width="616" height="74" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="21" font-weight="720"><text x="148" y="375">Partition 0</text><text x="148" y="475">Partition 1</text><text x="148" y="575">Partition 2</text></g><g font-size="14" font-weight="750" text-anchor="end"><text x="690" y="375" fill="#a70d18">Broker 1</text><text x="690" y="475" fill="#275d91">Broker 2</text><text x="690" y="575" fill="#187769">Broker 3</text></g></g>
    <g filter="url(#shadow)"><rect x="820" y="244" width="310" height="390" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="820" y="244" width="310" height="48" rx="8" fill="#275d91"/><text x="846" y="276" fill="#fff" font-size="17" font-weight="750">CONSUMER GROUP</text><g fill="#fffdfa" stroke-width="3"><rect x="860" y="330" width="230" height="74" rx="7" stroke="#a70d18"/><rect x="860" y="430" width="230" height="74" rx="7" stroke="#275d91"/><rect x="860" y="530" width="230" height="74" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="20" font-weight="720"><text x="892" y="375">Consumer A</text><text x="892" y="475">Consumer B</text><text x="892" y="575">Consumer C</text></g></g>
    <g stroke-width="4" fill="none" opacity=".28"><path d="M770 367H820" stroke="#a70d18"/><path d="M770 467H820" stroke="#275d91"/><path d="M770 567H820" stroke="#187769"/></g><g stroke="#fffdfa" stroke-width="2.5"><circle cy="367" r="8" fill="#a70d18"><animate attributeName="cx" values="774;816;774" dur="6s" begin="0s" repeatCount="indefinite"/></circle><circle cy="467" r="8" fill="#275d91"><animate attributeName="cx" values="774;816;774" dur="6s" begin="-2s" repeatCount="indefinite"/></circle><circle cy="567" r="8" fill="#187769"><animate attributeName="cx" values="778;816;778" dur="6s" begin="-4s" repeatCount="indefinite"/></circle></g>

  </g>
</svg>
