<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One Topic, three ordered logs</title><desc id="desc">The orders.events topic consists of three independent append-only partitions.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">One Topic, <tspan fill="#a70d18">three ordered logs</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Partitions write and read independently while preserving their own order</text>
    <g filter="url(#shadow)"><rect x="70" y="210" width="1060" height="420" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="210" width="1060" height="50" rx="8" fill="#172033"/><text x="98" y="243" fill="#fff" font-size="18" font-weight="750">TOPIC · orders.events</text><text x="1098" y="243" text-anchor="end" fill="#c8ced8" font-size="13" font-weight="650">logical stream</text>
      <g><rect x="112" y="304" width="976" height="78" rx="7" fill="#fff7f5" stroke="#a70d18" stroke-width="2.5"/><rect x="112" y="405" width="976" height="78" rx="7" fill="#f5f8fb" stroke="#275d91" stroke-width="2.5"/><rect x="112" y="506" width="976" height="78" rx="7" fill="#f1f8f6" stroke="#187769" stroke-width="2.5"/></g><g font-size="19" font-weight="750"><text x="140" y="351" fill="#a70d18">P0</text><text x="140" y="452" fill="#275d91">P1</text><text x="140" y="553" fill="#187769">P2</text></g>
      <g fill="#fff" stroke-width="2.5"><g stroke="#a70d18"><rect x="230" y="322" width="74" height="42" rx="5"/><rect x="318" y="322" width="74" height="42" rx="5"/><rect x="406" y="322" width="74" height="42" rx="5"/></g><g stroke="#275d91"><rect x="230" y="423" width="74" height="42" rx="5"/><rect x="318" y="423" width="74" height="42" rx="5"/><rect x="406" y="423" width="74" height="42" rx="5"/></g><g stroke="#187769"><rect x="230" y="524" width="74" height="42" rx="5"/><rect x="318" y="524" width="74" height="42" rx="5"/><rect x="406" y="524" width="74" height="42" rx="5"/></g></g><g fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><text x="267" y="348">A</text><text x="355" y="348">D</text><text x="443" y="348">G</text><text x="267" y="449">B</text><text x="355" y="449">E</text><text x="443" y="449">H</text><text x="267" y="550">C</text><text x="355" y="550">F</text><text x="443" y="550">I</text></g><g fill="#6a6862" font-size="15"><text x="540" y="349">ordered independently</text><text x="540" y="450">ordered independently</text><text x="540" y="551">ordered independently</text></g>
