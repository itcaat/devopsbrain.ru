<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="640" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">One Partition per active Consumer</title><desc id="desc">Kafka assigns each of three topic partitions to exactly one consumer in the same group.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><path id="a0" d="M418 335H782"/><path id="a1" d="M418 435H782"/><path id="a2" d="M418 535H782"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">One Partition per <tspan fill="#a70d18">active Consumer</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Inside one group, a Partition has exactly one reader at a time</text><g transform="translate(918 48)"><rect width="222" height="64" rx="7" fill="#172033"/><circle cx="28" cy="25" r="7" fill="#e4475b"/><text x="48" y="29" fill="#fff" font-size="14" font-weight="750">GROUP workers</text><text x="48" y="48" fill="#c8ced8" font-size="11" font-weight="650">3 PARTITIONS · 3 ACTIVE</text></g>
    <g filter="url(#shadow)"><rect x="70" y="220" width="348" height="400" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="220" width="348" height="46" rx="8" fill="#172033"/><text x="96" y="251" fill="#fff" font-size="17" font-weight="750">TOPIC · orders.events</text><g fill="#fffdfa" stroke-width="3"><rect x="112" y="298" width="264" height="74" rx="7" stroke="#a70d18"/><rect x="112" y="398" width="264" height="74" rx="7" stroke="#275d91"/><rect x="112" y="498" width="264" height="74" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="22" font-weight="720"><text x="148" y="343">Partition 0</text><text x="148" y="443">Partition 1</text><text x="148" y="543">Partition 2</text></g></g>
    <g filter="url(#shadow)"><rect x="782" y="220" width="348" height="400" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="782" y="220" width="348" height="46" rx="8" fill="#275d91"/><text x="808" y="251" fill="#fff" font-size="17" font-weight="750">CONSUMER GROUP · workers</text><g fill="#fffdfa" stroke-width="3"><rect x="824" y="298" width="264" height="74" rx="7" stroke="#a70d18"/><rect x="824" y="398" width="264" height="74" rx="7" stroke="#275d91"/><rect x="824" y="498" width="264" height="74" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="22" font-weight="720"><text x="860" y="343">Consumer A</text><text x="860" y="443">Consumer B</text><text x="860" y="543">Consumer C</text></g></g>
    <g fill="none" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".32"><use xlink:href="#a0"/><use xlink:href="#a1"/><use xlink:href="#a2"/></g><g stroke="#fffdfa" stroke-width="3"><circle r="9" fill="#a70d18"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#a0"/></animateMotion></circle><circle r="9" fill="#275d91"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#a1"/></animateMotion></circle><rect x="-8" y="-8" width="16" height="16" rx="4" fill="#187769"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#a2"/></animateMotion></rect></g>
    <g transform="translate(60 692)"><rect width="1080" height="62" rx="7" fill="#172033"/><circle cx="30" cy="31" r="7" fill="#a70d18"/><text x="50" y="38" fill="#fff" font-size="18" font-weight="650">P0 → Consumer A</text><path d="M288 31H358" stroke="#8c94a3" stroke-width="2"/><circle cx="386" cy="31" r="7" fill="#275d91"/><text x="406" y="38" fill="#fff" font-size="18" font-weight="650">P1 → Consumer B</text><path d="M656 31H726" stroke="#8c94a3" stroke-width="2"/><circle cx="754" cy="31" r="7" fill="#187769"/><text x="774" y="38" fill="#fff" font-size="18" font-weight="650">P2 → Consumer C</text></g>
  </g>
</svg>
