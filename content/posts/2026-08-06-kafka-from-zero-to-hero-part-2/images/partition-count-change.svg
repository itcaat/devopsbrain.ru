<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Adding Partitions can remap keys</title><desc id="desc">Older events for order 48291 remain in Partition 1, while a new event can map to Partition 4 after the Partition count changes.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="46" font-weight="760">Adding Partitions can <tspan fill="#a70d18">remap keys</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Old records stay where they are; new records use the new Partition count</text>
    <g filter="url(#shadow)"><rect x="60" y="210" width="1080" height="180" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="60" y="210" width="1080" height="44" rx="8" fill="#275d91"/><text x="86" y="240" fill="#fff" font-size="16" font-weight="750">BEFORE · 3 PARTITIONS</text><text x="1108" y="240" text-anchor="end" fill="#d8e4ef" font-size="12" font-weight="650">orderId 48291 → P1</text><g fill="#fffdfa" stroke-width="2.5"><rect x="110" y="292" width="260" height="58" rx="7" stroke="#8c94a3"/><rect x="470" y="292" width="260" height="58" rx="7" stroke="#a70d18"/><rect x="830" y="292" width="260" height="58" rx="7" stroke="#8c94a3"/></g><g fill="#172033" font-size="19" font-weight="720"><text x="136" y="328">P0</text><text x="496" y="328">P1</text><text x="856" y="328">P2</text></g><g fill="#a70d18" font-size="13" font-weight="750"><text x="586" y="328">E1 · E2 · E3</text></g></g>
    <g filter="url(#shadow)"><rect x="60" y="430" width="1080" height="210" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="60" y="430" width="1080" height="44" rx="8" fill="#a70d18"/><text x="86" y="460" fill="#fff" font-size="16" font-weight="750">AFTER · 5 PARTITIONS</text><text x="1108" y="460" text-anchor="end" fill="#f4d9da" font-size="12" font-weight="650">same orderId can now map to P4</text><g fill="#fffdfa" stroke-width="2.5"><rect x="94" y="514" width="180" height="66" rx="7" stroke="#8c94a3"/><rect x="302" y="514" width="180" height="66" rx="7" stroke="#a70d18"/><rect x="510" y="514" width="180" height="66" rx="7" stroke="#8c94a3"/><rect x="718" y="514" width="180" height="66" rx="7" stroke="#8c94a3"/><rect x="926" y="514" width="180" height="66" rx="7" stroke="#275d91"/></g><g fill="#172033" font-size="18" font-weight="720"><text x="118" y="553">P0</text><text x="326" y="553">P1</text><text x="534" y="553">P2</text><text x="742" y="553">P3</text><text x="950" y="553">P4</text></g><text x="385" y="553" fill="#a70d18" font-size="12" font-weight="750">E1 · E2 · E3 stay</text><text x="1012" y="553" fill="#275d91" font-size="12" font-weight="750">E4 new</text></g>
    <circle cy="547" r="9" fill="#275d91" stroke="#fffdfa" stroke-width="3"><animate attributeName="cx" values="1008;1068;1008" dur="6s" repeatCount="indefinite"/></circle>

  </g>
</svg>
