<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Independent Consumer Groups</title><desc id="desc">Email, Analytics, and Fraud consumer groups independently read the same orders.events topic and maintain their own offsets.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><path id="g1" d="M470 420 C600 420 610 290 740 290"/><path id="g2" d="M470 420H740"/><path id="g3" d="M470 420 C600 420 610 550 740 550"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">Independent <tspan fill="#a70d18">Consumer Groups</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">The same event is available to every service group</text>
    <g filter="url(#shadow)"><rect x="70" y="292" width="400" height="256" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="292" width="400" height="46" rx="8" fill="#172033"/><text x="96" y="323" fill="#fff" font-size="17" font-weight="750">TOPIC · orders.events</text><g fill="#fff" stroke-width="2.5"><rect x="112" y="392" width="64" height="56" rx="6" stroke="#a70d18"/><rect x="188" y="392" width="64" height="56" rx="6" stroke="#275d91"/><rect x="264" y="392" width="64" height="56" rx="6" stroke="#187769"/><rect x="340" y="392" width="64" height="56" rx="6" stroke="#a70d18"/></g><g fill="#172033" font-size="15" font-weight="750" text-anchor="middle"><text x="144" y="426">E1</text><text x="220" y="426">E2</text><text x="296" y="426">E3</text><text x="372" y="426">E4</text></g><text x="270" y="496" text-anchor="middle" fill="#6a6862" font-size="16">retained event history</text></g>
    <g fill="#fffdfa" stroke-width="3" filter="url(#shadow)"><rect x="740" y="228" width="390" height="124" rx="8" stroke="#187769"/><rect x="740" y="358" width="390" height="124" rx="8" stroke="#275d91"/><rect x="740" y="488" width="390" height="124" rx="8" stroke="#a70d18"/></g><g fill="#172033" font-size="23" font-weight="720"><text x="776" y="278">Email Group</text><text x="776" y="408">Analytics Group</text><text x="776" y="538">Fraud Group</text></g><g fill="#6a6862" font-size="15"><text x="776" y="311">own offset · reads all events</text><text x="776" y="441">own offset · reads all events</text><text x="776" y="571">own offset · reads all events</text></g>
    <g fill="none" stroke-width="4" opacity=".32"><use xlink:href="#g1" stroke="#187769" marker-end="url(#ag)"/><use xlink:href="#g2" stroke="#275d91" marker-end="url(#ab)"/><use xlink:href="#g3" stroke="#a70d18" marker-end="url(#ar)"/></g><g stroke="#fffdfa" stroke-width="3"><circle r="9" fill="#187769"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#g1"/></animateMotion></circle><circle r="9" fill="#275d91"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#g2"/></animateMotion></circle><circle r="9" fill="#a70d18"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#g3"/></animateMotion></circle></g>

  </g>
</svg>
