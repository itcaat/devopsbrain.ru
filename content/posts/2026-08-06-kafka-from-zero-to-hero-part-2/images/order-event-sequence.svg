<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One order, one event sequence</title><desc id="desc">Five events for order 48291 progress in business order from creation to delivery.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><path id="timeline" d="M140 430H1060"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">One order, <tspan fill="#a70d18">one event sequence</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Business decisions depend on seeing related events in the correct order</text>
    <path d="M140 430H1060" stroke="#d9c4c4" stroke-width="5" marker-end="url(#ar)"/><g filter="url(#shadow)"><g fill="#fffdfa" stroke-width="3"><rect x="80" y="300" width="200" height="104" rx="8" stroke="#a70d18"/><rect x="290" y="456" width="200" height="104" rx="8" stroke="#275d91"/><rect x="500" y="300" width="200" height="104" rx="8" stroke="#187769"/><rect x="710" y="456" width="200" height="104" rx="8" stroke="#275d91"/><rect x="920" y="300" width="200" height="104" rx="8" stroke="#a70d18"/></g></g>
    <g fill="#172033" font-size="18" font-weight="720" text-anchor="middle"><text x="180" y="345">OrderCreated</text><text x="390" y="501">PaymentStarted</text><text x="600" y="345">PaymentConfirmed</text><text x="810" y="501">ShipmentStarted</text><text x="1020" y="345">OrderDelivered</text></g><g fill="#6a6862" font-size="13" text-anchor="middle"><text x="180" y="373">step 1</text><text x="390" y="529">step 2</text><text x="600" y="373">step 3</text><text x="810" y="529">step 4</text><text x="1020" y="373">step 5</text></g><g fill="#a70d18"><circle cx="180" cy="430" r="8"/><circle cx="390" cy="430" r="8"/><circle cx="600" cy="430" r="8"/><circle cx="810" cy="430" r="8"/><circle cx="1020" cy="430" r="8"/></g><circle r="13" fill="#a70d18" stroke="#fffdfa" stroke-width="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#timeline"/></animateMotion></circle>

  </g>
</svg>
