<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The key selects the Partition</title><desc id="desc">Events with orderId 48291 are hashed and consistently routed to Partition 1 while the Partition count remains unchanged.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><path id="flow" d="M300 420H492H686 C750 420 760 470 830 470"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">The Key <tspan fill="#a70d18">selects the Partition</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Related events keep the same route while the Partition count stays unchanged</text>
    <g filter="url(#shadow)"><rect x="70" y="326" width="230" height="188" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="326" width="230" height="44" rx="8" fill="#a70d18"/><text x="185" y="356" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">MESSAGE KEY</text><text x="185" y="422" text-anchor="middle" fill="#172033" font-size="24" font-weight="720">orderId</text><text x="185" y="464" text-anchor="middle" fill="#a70d18" font-size="31" font-weight="760">48291</text></g>
    <g filter="url(#shadow)"><rect x="492" y="326" width="194" height="188" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="492" y="326" width="194" height="44" rx="8" fill="#275d91"/><text x="589" y="356" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">PARTITIONER</text><text x="589" y="427" text-anchor="middle" fill="#172033" font-size="27" font-weight="730">hash(key)</text><text x="589" y="465" text-anchor="middle" fill="#6a6862" font-size="16">stable mapping</text></g>
    <g filter="url(#shadow)"><rect x="830" y="250" width="300" height="340" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="830" y="250" width="300" height="46" rx="8" fill="#172033"/><text x="856" y="281" fill="#fff" font-size="17" font-weight="750">orders.events</text><g fill="#fffdfa" stroke-width="3"><rect x="868" y="326" width="224" height="72" rx="7" stroke="#8c94a3"/><rect x="868" y="434" width="224" height="72" rx="7" stroke="#a70d18"/><rect x="868" y="542" width="224" height="72" rx="7" stroke="#8c94a3"/></g><g fill="#172033" font-size="21" font-weight="720"><text x="898" y="369">P0</text><text x="898" y="477">P1</text><text x="898" y="585">P2</text></g><rect x="982" y="451" width="84" height="32" rx="5" fill="#f3e5e4"/><text x="1024" y="472" text-anchor="middle" fill="#a70d18" font-size="11" font-weight="750">SELECTED</text></g>
    <path d="M300 420H492M686 420C750 420 760 470 830 470" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#ar)" opacity=".32"/><g fill="#a70d18" stroke="#fffdfa" stroke-width="3"><circle r="9"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle><circle r="9"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle><circle r="9"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle></g>

  </g>
</svg>
