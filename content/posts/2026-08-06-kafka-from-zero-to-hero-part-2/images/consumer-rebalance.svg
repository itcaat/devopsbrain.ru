<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Rebalance after a Consumer failure</title><desc id="desc">Consumer B fails and Kafka reassigns Partition 1 to Consumer A while processing continues.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760">Rebalance after a <tspan fill="#a70d18">Consumer failure</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Kafka pauses assignment briefly, then moves orphaned Partition to a live member</text>
    <g filter="url(#shadow)"><rect x="70" y="224" width="330" height="396" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="224" width="330" height="46" rx="8" fill="#172033"/><text x="96" y="255" fill="#fff" font-size="17" font-weight="750">TOPIC PARTITIONS</text><g fill="#fffdfa" stroke-width="3"><rect x="112" y="300" width="246" height="72" rx="7" stroke="#a70d18"/><rect x="112" y="410" width="246" height="72" rx="7" stroke="#275d91"/><rect x="112" y="520" width="246" height="72" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="22" font-weight="720"><text x="148" y="344">Partition 0</text><text x="148" y="454">Partition 1</text><text x="148" y="564">Partition 2</text></g></g>
    <g filter="url(#shadow)"><rect x="800" y="224" width="330" height="396" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="800" y="224" width="330" height="46" rx="8" fill="#275d91"/><text x="826" y="255" fill="#fff" font-size="17" font-weight="750">CONSUMER GROUP</text><g fill="#fffdfa" stroke-width="3"><rect x="842" y="300" width="246" height="72" rx="7" stroke="#a70d18"/><rect x="842" y="410" width="246" height="72" rx="7" stroke="#9a9da4" stroke-dasharray="8 6"/><rect x="842" y="520" width="246" height="72" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="22" font-weight="720"><text x="878" y="344">Consumer A</text><text x="878" y="444">Consumer B</text><text x="878" y="564">Consumer C</text></g><text x="878" y="467" fill="#a70d18" font-size="12" font-weight="750">FAILED</text></g>
    <g id="before"><path d="M400 336H800" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".34"/><path d="M400 446H800" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".34"/><path d="M400 556H800" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".34"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.3;.42;.88;1" dur="6s" repeatCount="indefinite"/></g>
    <g id="after"><path d="M400 336H800" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".34"/><path d="M400 446 C590 446 610 352 800 352" stroke="#a70d18" stroke-width="4" marker-end="url(#ar)" opacity=".5"/><path d="M400 556H800" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".34"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.52;.88;1" dur="6s" repeatCount="indefinite"/></g>
    <g transform="translate(500 402)"><rect width="200" height="70" rx="7" fill="#fff7f5" stroke="#a70d18" stroke-width="2.5"/><text x="100" y="29" text-anchor="middle" fill="#a70d18" font-size="13" font-weight="750">REBALANCE</text><text x="100" y="52" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">P1 → Consumer A</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.5;.86;1" dur="6s" repeatCount="indefinite"/></g>

  </g>
</svg>
