<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="640" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Three Partitions, five Consumers</title><desc id="desc">Only three consumers can be active because the topic has three partitions. Two consumers remain idle.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><path id="a0" d="M416 300H786"/><path id="a1" d="M416 420H786"/><path id="a2" d="M416 540H786"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="42" font-weight="760">Three Partitions, <tspan fill="#a70d18">five Consumers</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Parallelism is limited by the number of Partitions in the Topic</text><g transform="translate(916 48)"><rect width="224" height="64" rx="7" fill="#172033"/><circle cx="28" cy="25" r="7" fill="#e4475b"/><text x="48" y="29" fill="#fff" font-size="14" font-weight="750">GROUP CAPACITY</text><text x="48" y="48" fill="#c8ced8" font-size="11" font-weight="650">3 ACTIVE · 2 IDLE</text></g>
    <g filter="url(#shadow)"><rect x="70" y="222" width="346" height="396" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="222" width="346" height="46" rx="8" fill="#172033"/><text x="96" y="253" fill="#fff" font-size="17" font-weight="750">TOPIC · 3 PARTITIONS</text><g fill="#fffdfa" stroke-width="3"><rect x="112" y="263" width="262" height="74" rx="7" stroke="#a70d18"/><rect x="112" y="383" width="262" height="74" rx="7" stroke="#275d91"/><rect x="112" y="503" width="262" height="74" rx="7" stroke="#187769"/></g><g fill="#172033" font-size="22" font-weight="720"><text x="148" y="308">Partition 0</text><text x="148" y="428">Partition 1</text><text x="148" y="548">Partition 2</text></g></g>
    <g filter="url(#shadow)"><rect x="786" y="190" width="344" height="460" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="786" y="190" width="344" height="46" rx="8" fill="#275d91"/><text x="812" y="221" fill="#fff" font-size="17" font-weight="750">CONSUMER GROUP · 5 MEMBERS</text><g fill="#fffdfa" stroke-width="3"><rect x="826" y="263" width="264" height="74" rx="7" stroke="#a70d18"/><rect x="826" y="383" width="264" height="74" rx="7" stroke="#275d91"/><rect x="826" y="503" width="264" height="74" rx="7" stroke="#187769"/><rect x="826" y="250" width="0" height="0"/></g><g fill="#172033" font-size="21" font-weight="720"><text x="858" y="308">Consumer A</text><text x="858" y="428">Consumer B</text><text x="858" y="548">Consumer C</text></g><g><rect x="826" y="588" width="124" height="42" rx="6" fill="#f2f1ed" stroke="#9a9da4" stroke-width="2" stroke-dasharray="7 5"/><rect x="966" y="588" width="124" height="42" rx="6" fill="#f2f1ed" stroke="#9a9da4" stroke-width="2" stroke-dasharray="7 5"/><text x="888" y="615" text-anchor="middle" fill="#777b83" font-size="15" font-weight="700">D · IDLE</text><text x="1028" y="615" text-anchor="middle" fill="#777b83" font-size="15" font-weight="700">E · IDLE</text></g></g>
    <g fill="none" stroke="#275d91" stroke-width="4" marker-end="url(#ab)" opacity=".32"><use xlink:href="#a0"/><use xlink:href="#a1"/><use xlink:href="#a2"/></g><g stroke="#fffdfa" stroke-width="3"><circle r="9" fill="#a70d18"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#a0"/></animateMotion></circle><circle r="9" fill="#275d91"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#a1"/></animateMotion></circle><rect x="-8" y="-8" width="16" height="16" rx="4" fill="#187769"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#a2"/></animateMotion></rect></g>
    <g transform="translate(60 692)"><rect width="1080" height="62" rx="7" fill="#172033"/><circle cx="30" cy="31" r="7" fill="#a70d18"/><text x="50" y="38" fill="#fff" font-size="18" font-weight="650">3 Partitions</text><path d="M220 31H290" stroke="#8c94a3" stroke-width="2"/><circle cx="318" cy="31" r="7" fill="#275d91"/><text x="338" y="38" fill="#fff" font-size="18" font-weight="650">3 active Consumers</text><path d="M626 31H696" stroke="#8c94a3" stroke-width="2"/><circle cx="724" cy="31" r="7" fill="#187769"/><text x="744" y="38" fill="#fff" font-size="18" font-weight="650">Extra members wait idle</text></g>
  </g>
</svg>
