<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Partition first, Broker second</title><desc id="desc">The Producer selects a Partition, resolves its current Leader from cluster metadata, and writes to that Broker.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><path id="route-a" d="M280 420H456"/><path id="route-b" d="M674 420 C740 420 750 470 810 470"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="48" font-weight="760"><tspan fill="#a70d18">Partition</tspan> first, Broker second</text><text x="62" y="122" fill="#5c6069" font-size="21">Producer chooses a log, then sends the record to its current Leader</text>
    <g filter="url(#shadow)"><rect x="70" y="326" width="210" height="188" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="326" width="210" height="44" rx="8" fill="#a70d18"/><text x="175" y="356" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">PRODUCER</text><text x="175" y="423" text-anchor="middle" fill="#172033" font-size="27" font-weight="730">Orders Service</text><text x="175" y="456" text-anchor="middle" fill="#6a6862" font-size="16">key: orderId</text><rect x="111" y="476" width="128" height="25" rx="4" fill="#f3e5e4"/><text x="175" y="494" text-anchor="middle" fill="#a70d18" font-size="12" font-weight="750">48291</text></g>
    <g filter="url(#shadow)"><rect x="456" y="310" width="218" height="220" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="456" y="310" width="218" height="44" rx="8" fill="#275d91"/><text x="565" y="340" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">PARTITIONER</text><text x="565" y="407" text-anchor="middle" fill="#172033" font-size="25" font-weight="730">Select P1</text><text x="565" y="440" text-anchor="middle" fill="#6a6862" font-size="16">using the message key</text><rect x="493" y="468" width="144" height="31" rx="5" fill="#e7eff7"/><text x="565" y="489" text-anchor="middle" fill="#275d91" font-size="12" font-weight="750">METADATA → BROKER 2</text></g>
    <g filter="url(#shadow)"><rect x="810" y="250" width="320" height="340" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="810" y="250" width="320" height="46" rx="8" fill="#172033"/><text x="836" y="281" fill="#fff" font-size="17" font-weight="750">KAFKA CLUSTER</text><g fill="#fffdfa" stroke-width="3"><rect x="846" y="326" width="248" height="72" rx="7" stroke="#8c94a3"/><rect x="846" y="434" width="248" height="72" rx="7" stroke="#a70d18"/><rect x="846" y="542" width="248" height="72" rx="7" stroke="#8c94a3"/></g><g fill="#172033" font-size="20" font-weight="700"><text x="872" y="369">Broker 1</text><text x="872" y="477">Broker 2</text><text x="872" y="585">Broker 3</text></g><g font-size="13" font-weight="750" text-anchor="end"><text x="1070" y="369" fill="#6a6862">Leader P0</text><text x="1070" y="477" fill="#a70d18">Leader P1</text><text x="1070" y="585" fill="#6a6862">Leader P2</text></g></g>
    <use xlink:href="#route-a" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#ar)" opacity=".32"/><use xlink:href="#route-b" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#ar)" opacity=".32"/><g fill="#a70d18" stroke="#fffdfa" stroke-width="3"><circle r="10"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#route-a"/></animateMotion></circle><circle r="10"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath xlink:href="#route-b"/></animateMotion></circle></g>

  </g>
</svg>
