<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Kafka log and independent offsets</title><desc id="desc">Messages remain in Kafka while two consumers advance their offsets independently and one can replay earlier records.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="50" font-weight="760">Kafka log: <tspan fill="#a70d18">messages stay</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Consumers move their own offsets through the same retained history</text><g transform="translate(916 48)"><rect width="224" height="64" rx="7" fill="#172033"/><circle cx="28" cy="25" r="7" fill="#e4475b"/><text x="48" y="29" fill="#fff" font-size="14" font-weight="750">RETAINED LOG</text><text x="48" y="48" fill="#c8ced8" font-size="11" font-weight="650">READ · RESUME · REPLAY</text></g>
    <g filter="url(#shadow)"><rect x="70" y="224" width="1060" height="236" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="224" width="1060" height="48" rx="8" fill="#172033"/><text x="98" y="256" fill="#fff" font-size="17" font-weight="750">TOPIC · orders.events · PARTITION 0</text><text x="1098" y="256" text-anchor="end" fill="#c8ced8" font-size="13" font-weight="650">append-only log</text>
      <g fill="#fff" stroke-width="3"><rect x="126" y="324" width="108" height="76" rx="7" stroke="#a70d18"/><rect x="264" y="324" width="108" height="76" rx="7" stroke="#275d91"/><rect x="402" y="324" width="108" height="76" rx="7" stroke="#187769"/><rect x="540" y="324" width="108" height="76" rx="7" stroke="#a70d18"/><rect x="678" y="324" width="108" height="76" rx="7" stroke="#275d91"/><rect x="816" y="324" width="108" height="76" rx="7" stroke="#187769"/><rect x="954" y="324" width="108" height="76" rx="7" stroke="#a70d18"/></g>
      <g fill="#172033" font-size="25" font-weight="750" text-anchor="middle"><text x="180" y="369">A</text><text x="318" y="369">B</text><text x="456" y="369">C</text><text x="594" y="369">D</text><text x="732" y="369">E</text><text x="870" y="369">F</text><text x="1008" y="369">G</text></g><g fill="#6a6862" font-size="13" font-weight="650" text-anchor="middle"><text x="180" y="424">offset 0</text><text x="318" y="424">offset 1</text><text x="456" y="424">offset 2</text><text x="594" y="424">offset 3</text><text x="732" y="424">offset 4</text><text x="870" y="424">offset 5</text><text x="1008" y="424">offset 6</text></g></g>
    <g filter="url(#shadow)"><rect x="70" y="510" width="500" height="118" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><text x="98" y="548" fill="#275d91" font-size="14" font-weight="750">PAYMENT GROUP</text><text x="98" y="580" fill="#172033" font-size="22" font-weight="710">processes in its own pace</text><path d="M340 605H526" stroke="#c8d9e8" stroke-width="8" stroke-linecap="round"/><circle cy="605" r="11" fill="#275d91" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="350;516;516;350" keyTimes="0;.55;.86;1" dur="6s" repeatCount="indefinite"/></circle></g>
    <g filter="url(#shadow)"><rect x="630" y="510" width="500" height="118" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/><text x="658" y="548" fill="#187769" font-size="14" font-weight="750">ANALYTICS GROUP</text><text x="658" y="580" fill="#172033" font-size="22" font-weight="710">can replay earlier events</text><path d="M900 605H1086" stroke="#cbe3de" stroke-width="8" stroke-linecap="round"/><rect y="596" width="18" height="18" rx="4" fill="#187769" stroke="#fff" stroke-width="3"><animate attributeName="x" values="900;1068;1068;934;900" keyTimes="0;.48;.68;.8;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(60 692)"><rect width="1080" height="62" rx="7" fill="#172033"/><circle cx="30" cy="31" r="7" fill="#a70d18"/><text x="50" y="38" fill="#fff" font-size="18" font-weight="650">Records remain available</text><path d="M340 31H410" stroke="#8c94a3" stroke-width="2"/><circle cx="438" cy="31" r="7" fill="#275d91"/><text x="458" y="38" fill="#fff" font-size="18" font-weight="650">Each group owns its offset</text><path d="M788 31H858" stroke="#8c94a3" stroke-width="2"/><circle cx="886" cy="31" r="7" fill="#187769"/><text x="906" y="38" fill="#fff" font-size="18" font-weight="650">Replay is possible</text></g>
  </g>
</svg>
