      <rect x="60" y="374" width="206" height="44" rx="8" fill="#a70d18"/>
      <path d="M60 410 H266" stroke="#a70d18" stroke-width="3"/>
      <text x="163" y="403" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="750">PRODUCER</text>
      <g transform="translate(113 454)" fill="none" stroke="#a70d18" stroke-width="4">
        <rect width="100" height="72" rx="7"/>
        <path d="M20 20 L8 36 L20 52 M80 20 L92 36 L80 52 M58 15 L42 57"/>
      </g>
      <text x="163" y="561" text-anchor="middle" fill="#172033" font-size="27" font-weight="720">Orders Service</text>
      <text x="163" y="590" text-anchor="middle" fill="#6a6862" font-size="18">publishes OrderCreated</text>
    </g><g filter="url(#soft-shadow)">
