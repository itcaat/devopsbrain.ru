<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="443" viewBox="0 0 1440 664" role="img" aria-labelledby="title desc">
  <title id="title">Kafka from zero to hero</title>
  <desc id="desc">A producer publishes events to partitions hosted by Kafka brokers. Two consumer groups read the same topic independently.</desc>
  <defs>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d9d6cf" opacity="0.45"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a70d18"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#275d91"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187769"/>
    </marker>

    <path id="publish-p0" d="M 266 496 C 320 496 326 394 382 394"/>
    <path id="publish-p1" d="M 266 496 C 320 496 326 496 382 496"/>
    <path id="publish-p2" d="M 266 496 C 320 496 326 598 382 598"/>
    <path id="group-a-p0" d="M 860 394 C 930 394 930 410 1000 410"/>
    <path id="group-a-p1" d="M 860 496 C 930 496 930 446 1000 446"/>
    <path id="group-a-p2" d="M 860 598 C 930 598 930 482 1000 482"/>
    <path id="group-b-p0" d="M 860 394 C 930 394 930 586 1000 586"/>
    <path id="group-b-p1" d="M 860 496 C 930 496 930 622 1000 622"/>
    <path id="group-b-p2" d="M 860 598 C 930 598 930 658 1000 658"/>
  </defs>

  <rect width="1440" height="960" fill="#f8f6f1"/>
  <rect width="1440" height="960" fill="url(#dot-grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="74" y="102" fill="#172033" font-size="64" font-weight="760" letter-spacing="0"><tspan fill="#a70d18">Kafka</tspan> from zero to <tspan fill="#a70d18">hero</tspan></text>














  <g transform="translate(0 -100)"><g filter="url(#soft-shadow)">
