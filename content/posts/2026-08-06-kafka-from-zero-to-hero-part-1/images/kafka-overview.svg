        <g fill="#ffffff" stroke="#a70d18" stroke-width="2">
          <rect x="474" y="488" width="50" height="40" rx="4"/><rect x="529" y="488" width="50" height="40" rx="4"/><rect x="584" y="488" width="50" height="40" rx="4"/><rect x="639" y="488" width="50" height="40" rx="4"/>
        </g>
