      <path d="M1000 376 H1364" stroke="#275d91" stroke-width="3"/>
      <text x="1024" y="370" fill="#ffffff" font-size="17" font-weight="750">CONSUMER GROUP A</text>
      <text x="1024" y="418" fill="#172033" font-size="23" font-weight="720">Payment Service</text>
      <text x="1024" y="449" fill="#6a6862" font-size="17">reads every Partition</text>
