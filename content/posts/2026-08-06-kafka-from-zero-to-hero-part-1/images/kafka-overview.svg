        </g>
        <g fill="#5c6069" font-size="13" font-weight="700" text-anchor="middle"><text x="499" y="615">0</text><text x="554" y="615">1</text><text x="609" y="615">2</text><text x="664" y="615">3</text></g>
        <rect x="737" y="585" width="112" height="50" rx="5" fill="#f0e7e4" stroke="#a70d18" stroke-width="2"/>
        <text x="793" y="616" text-anchor="middle" fill="#172033" font-size="17" font-weight="700">Broker 3</text>
      </g>

      <text x="620" y="688" text-anchor="middle" fill="#6a6862" font-size="15">each Partition is an ordered append-only log</text>
    </g><g filter="url(#soft-shadow)">
      <rect x="1000" y="342" width="364" height="174" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/>
