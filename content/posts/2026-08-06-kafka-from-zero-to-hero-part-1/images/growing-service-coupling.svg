<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="356" viewBox="0 181 1200 445" role="img" aria-labelledby="title desc">
  <title id="title">Coupling grows with the system</title><desc id="desc">Orders Service directly depends on eight downstream services.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker>
    <path id="l1" d="M480 374 C400 374 390 258 320 258"/><path id="l2" d="M480 406 C400 406 390 354 320 354"/><path id="l3" d="M480 438 C400 438 390 450 320 450"/><path id="l4" d="M480 470 C400 470 390 546 320 546"/><path id="r1" d="M720 374 C800 374 810 258 880 258"/><path id="r2" d="M720 406 C800 406 810 354 880 354"/><path id="r3" d="M720 438 C800 438 810 450 880 450"/><path id="r4" d="M720 470 C800 470 810 546 880 546"/>
  </defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <g filter="url(#shadow)"><rect x="480" y="318" width="240" height="208" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="4"/><rect x="480" y="318" width="240" height="46" rx="8" fill="#a70d18"/><text x="600" y="349" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">COORDINATOR</text><text x="600" y="420" text-anchor="middle" fill="#172033" font-size="29" font-weight="730">Orders Service</text><text x="600" y="454" text-anchor="middle" fill="#6a6862" font-size="17">knows every integration</text><rect x="523" y="480" width="154" height="29" rx="5" fill="#f3e5e4"/><text x="600" y="500" text-anchor="middle" fill="#a70d18" font-size="12" font-weight="750">BLAST RADIUS GROWS</text></g>
    <g fill="#fffdfa" stroke-width="3" filter="url(#shadow)"><rect x="80" y="218" width="240" height="80" rx="8" stroke="#a70d18"/><rect x="80" y="314" width="240" height="80" rx="8" stroke="#275d91"/><rect x="80" y="410" width="240" height="80" rx="8" stroke="#187769"/><rect x="80" y="506" width="240" height="80" rx="8" stroke="#275d91"/><rect x="880" y="218" width="240" height="80" rx="8" stroke="#187769"/><rect x="880" y="314" width="240" height="80" rx="8" stroke="#a70d18"/><rect x="880" y="410" width="240" height="80" rx="8" stroke="#275d91"/><rect x="880" y="506" width="240" height="80" rx="8" stroke="#187769"/></g>
    <g fill="#172033" font-size="22" font-weight="700" text-anchor="middle"><text x="200" y="267">Payment</text><text x="200" y="363">Inventory</text><text x="200" y="459">Email</text><text x="200" y="555">Analytics</text><text x="1000" y="267">Search</text><text x="1000" y="363">Fraud</text><text x="1000" y="459">Warehouse</text><text x="1000" y="555">Notifications</text></g>
    <g fill="none" stroke="#a70d18" stroke-width="3" marker-end="url(#arrow)" opacity=".32"><use xlink:href="#l1"/><use xlink:href="#l2"/><use xlink:href="#l3"/><use xlink:href="#l4"/><use xlink:href="#r1"/><use xlink:href="#r2"/><use xlink:href="#r3"/><use xlink:href="#r4"/></g>
    <g fill="#a70d18" stroke="#fffdfa" stroke-width="2.5"><circle r="7"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#l1"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-.75s" repeatCount="indefinite"><mpath xlink:href="#r1"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#l2"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-2.25s" repeatCount="indefinite"><mpath xlink:href="#r2"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath xlink:href="#l3"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-3.75s" repeatCount="indefinite"><mpath xlink:href="#r3"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-4.5s" repeatCount="indefinite"><mpath xlink:href="#l4"/></animateMotion></circle><circle r="7"><animateMotion dur="6s" begin="-5.25s" repeatCount="indefinite"><mpath xlink:href="#r4"/></animateMotion></circle></g>

