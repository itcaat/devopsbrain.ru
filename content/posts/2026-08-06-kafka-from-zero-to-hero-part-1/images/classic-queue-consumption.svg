<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Classic queue consumption</title><desc id="desc">A message is delivered to one consumer and removed after acknowledgement.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><path id="delivery" d="M606 414H812"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="43" font-weight="760">Classic queue: <tspan fill="#a70d18">consume and remove</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">One message is delivered to one worker</text>
    <g filter="url(#shadow)"><rect x="80" y="290" width="526" height="248" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="80" y="290" width="526" height="46" rx="8" fill="#172033"/><text x="108" y="321" fill="#fff" font-size="17" font-weight="750">TASK QUEUE</text><text x="560" y="321" text-anchor="end" fill="#c8ced8" font-size="13" font-weight="650">before acknowledgement</text>
      <g id="message-a"><rect x="126" y="382" width="116" height="78" rx="7" fill="#fff7f5" stroke="#a70d18" stroke-width="3"/><text x="184" y="430" text-anchor="middle" fill="#a70d18" font-size="27" font-weight="760">A</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.28;.34;.9;1" dur="6s" repeatCount="indefinite"/></g>
      <rect x="266" y="382" width="116" height="78" rx="7" fill="#f5f8fb" stroke="#275d91" stroke-width="3"/><text x="324" y="430" text-anchor="middle" fill="#275d91" font-size="27" font-weight="760">B</text><rect x="406" y="382" width="116" height="78" rx="7" fill="#f1f8f6" stroke="#187769" stroke-width="3"/><text x="464" y="430" text-anchor="middle" fill="#187769" font-size="27" font-weight="760">C</text><text x="343" y="500" text-anchor="middle" fill="#6a6862" font-size="16">messages waiting for work</text></g>
    <g filter="url(#shadow)"><rect x="812" y="314" width="308" height="200" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="812" y="314" width="308" height="46" rx="8" fill="#275d91"/><text x="966" y="345" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">CONSUMER</text><text x="966" y="419" text-anchor="middle" fill="#172033" font-size="27" font-weight="730">Worker</text><rect x="891" y="452" width="150" height="30" rx="5" fill="#e7eff7"/><text x="966" y="473" text-anchor="middle" fill="#275d91" font-size="13" font-weight="750">ACKNOWLEDGED</text></g>
    <use xlink:href="#delivery" fill="none" stroke="#275d91" stroke-width="4" marker-end="url(#arrow)" opacity=".35"/><g><rect x="-24" y="-18" width="48" height="36" rx="5" fill="#fff7f5" stroke="#a70d18" stroke-width="3"/><text x="0" y="7" text-anchor="middle" fill="#a70d18" font-size="18" font-weight="760">A</text><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.28;.58;1" calcMode="linear"><mpath xlink:href="#delivery"/></animateMotion><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.27;.3;.62;1" dur="6s" repeatCount="indefinite"/></g>

  </g>
</svg>
