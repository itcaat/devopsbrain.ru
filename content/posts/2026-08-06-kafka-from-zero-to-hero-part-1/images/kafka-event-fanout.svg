<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Publish once, consume independently</title><desc id="desc">Orders Service publishes OrderCreated to Kafka. Payment, Inventory, Email, and Analytics consume it independently.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker><path id="pub" d="M316 424H484"/><path id="c1" d="M716 424 C790 424 800 270 870 270"/><path id="c2" d="M716 424 C790 424 800 374 870 374"/><path id="c3" d="M716 424 C790 424 800 478 870 478"/><path id="c4" d="M716 424 C790 424 800 582 870 582"/></defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" fill="#172033" font-size="43" font-weight="760">Publish once, <tspan fill="#a70d18">consume independently</tspan></text><text x="62" y="122" fill="#5c6069" font-size="21">Orders Service publishes an event without knowing its consumers</text>
    <g filter="url(#shadow)"><rect x="70" y="326" width="246" height="196" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="326" width="246" height="44" rx="8" fill="#a70d18"/><text x="193" y="356" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">PRODUCER</text><text x="193" y="424" text-anchor="middle" fill="#172033" font-size="27" font-weight="730">Orders Service</text><text x="193" y="457" text-anchor="middle" fill="#6a6862" font-size="17">creates an order</text><rect x="113" y="479" width="160" height="27" rx="4" fill="#f3e5e4"/><text x="193" y="498" text-anchor="middle" fill="#a70d18" font-size="12" font-weight="750">OrderCreated</text></g>
    <g filter="url(#shadow)"><rect x="484" y="276" width="232" height="296" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="4"/><rect x="484" y="276" width="232" height="50" rx="8" fill="#172033"/><text x="600" y="309" text-anchor="middle" fill="#fff" font-size="18" font-weight="750">KAFKA</text><text x="600" y="395" text-anchor="middle" fill="#172033" font-size="31" font-weight="750">orders.events</text><text x="600" y="430" text-anchor="middle" fill="#6a6862" font-size="17">retained event stream</text><g fill="#fff" stroke="#a70d18" stroke-width="2"><rect x="526" y="465" width="42" height="42" rx="5"/><rect x="579" y="465" width="42" height="42" rx="5"/><rect x="632" y="465" width="42" height="42" rx="5"/></g><g fill="#a70d18" font-size="12" font-weight="750" text-anchor="middle"><text x="547" y="491">E1</text><text x="600" y="491">E2</text><text x="653" y="491">E3</text></g></g>
    <g fill="#fffdfa" stroke-width="3" filter="url(#shadow)"><rect x="870" y="228" width="260" height="84" rx="8" stroke="#a70d18"/><rect x="870" y="332" width="260" height="84" rx="8" stroke="#275d91"/><rect x="870" y="436" width="260" height="84" rx="8" stroke="#187769"/><rect x="870" y="540" width="260" height="84" rx="8" stroke="#275d91"/></g><g fill="#172033" font-size="22" font-weight="700"><text x="906" y="279">Payment Service</text><text x="906" y="383">Inventory Service</text><text x="906" y="487">Email Service</text><text x="906" y="591">Analytics Service</text></g>
    <use xlink:href="#pub" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#ar)" opacity=".35"/><g fill="none" stroke-width="3.5" opacity=".32"><use xlink:href="#c1" stroke="#a70d18" marker-end="url(#ar)"/><use xlink:href="#c2" stroke="#275d91" marker-end="url(#ab)"/><use xlink:href="#c3" stroke="#187769" marker-end="url(#ag)"/><use xlink:href="#c4" stroke="#275d91" marker-end="url(#ab)"/></g>
    <g stroke="#fffdfa" stroke-width="3"><circle r="10" fill="#a70d18"><animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#pub"/></animateMotion></circle><circle r="8" fill="#a70d18"><animateMotion dur="6s" begin="-.5s" repeatCount="indefinite"><mpath xlink:href="#c1"/></animateMotion></circle><circle r="8" fill="#275d91"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#c2"/></animateMotion></circle><circle r="8" fill="#187769"><animateMotion dur="6s" begin="-3.5s" repeatCount="indefinite"><mpath xlink:href="#c3"/></animateMotion></circle><circle r="8" fill="#275d91"><animateMotion dur="6s" begin="-5s" repeatCount="indefinite"><mpath xlink:href="#c4"/></animateMotion></circle></g>

  </g>
</svg>
