<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">ISR keeps failover current</title><desc id="desc">Only sufficiently synchronized replicas are ready to become Leader</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" text-anchor="start" fill="#172033" font-size="46" font-weight="760">ISR keeps </text><text x="308.4" y="82" text-anchor="start" fill="#a70d18" font-size="46" font-weight="760">failover current</text><text x="62" y="122" text-anchor="start" fill="#5c6069" font-size="21" font-weight="500">Only sufficiently synchronized replicas are ready to become Leader</text><g filter="url(#shadow)"><rect x="60" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3"/><rect x="60" y="250" width="237" height="44" rx="8" fill="#275d91"/><text x="178.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">BEFORE</text><text x="178.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">B1 Leader</text><text x="178.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">ISR: B1 B2 B3</text></g><line x1="297" y1="360" x2="333" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="341" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="341" y="250" width="237" height="44" rx="8" fill="#a70d18"/><text x="459.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">NETWORK ISSUE</text><text x="459.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">B3 falls behind</text><text x="459.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">ISR: B1 B2</text></g><line x1="578" y1="360" x2="614" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="622" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="622" y="250" width="237" height="44" rx="8" fill="#a70d18"/><text x="740.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">B1 FAILS</text><text x="740.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">Controller elects</text><text x="740.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">B2 as Leader</text></g><line x1="859" y1="360" x2="895" y2="360" stroke="#a70d18" stroke-width="4" opacity="0.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="903" y="250" width="237" height="220" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/><rect x="903" y="250" width="237" height="44" rx="8" fill="#187769"/><text x="1021.5" y="279" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">RECOVERY</text><text x="1021.5" y="332" text-anchor="middle" fill="#172033" font-size="19" font-weight="720">B1 catches up</text><text x="1021.5" y="361" text-anchor="middle" fill="#5c6069" font-size="15" font-weight="600">returns as Follower</text></g></g></svg>