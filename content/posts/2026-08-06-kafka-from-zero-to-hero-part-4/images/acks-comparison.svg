<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">What does acks confirm?</title><desc id="desc">The setting controls Kafka write acknowledgement, not business processing</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#275d91"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187769"/></marker></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif"><text x="60" y="82" text-anchor="start" fill="#172033" font-size="46" font-weight="760">What does </text><text x="308.4" y="82" text-anchor="start" fill="#a70d18" font-size="46" font-weight="760">acks confirm?</text><text x="62" y="122" text-anchor="start" fill="#5c6069" font-size="21" font-weight="500">The setting controls Kafka write acknowledgement, not business processing</text><g filter="url(#shadow)"><rect x="70" y="210" width="500" height="390" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/><rect x="70" y="210" width="500" height="48" rx="8" fill="#a70d18"/><text x="320" y="242" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">LESS WAITING</text><rect x="108" y="302" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="130" y="327" text-anchor="start" fill="#172033" font-size="17" font-weight="720">acks=0</text><text x="510" y="327" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">no reply</text><text x="130" y="348" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">loss can be invisible</text><rect x="108" y="384" width="424" height="58" rx="7" fill="#fff" stroke="#a70d18" stroke-width="3"/><text x="130" y="409" text-anchor="start" fill="#172033" font-size="17" font-weight="720">acks=1</text><text x="510" y="409" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">Leader only</text><text x="130" y="430" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">replicas may still lag</text><rect x="108" y="466" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="130" y="491" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Use case</text><text x="510" y="491" text-anchor="end" fill="#a70d18" font-size="14" font-weight="700">telemetry</text><text x="130" y="512" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">when small gaps are acceptable</text></g><g filter="url(#shadow)"><rect x="630" y="210" width="500" height="390" rx="8" fill="#fffdfa" stroke="#187769" stroke-width="3"/><rect x="630" y="210" width="500" height="48" rx="8" fill="#187769"/><text x="880" y="242" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">STRONGER DURABILITY</text><rect x="668" y="302" width="424" height="58" rx="7" fill="#fff" stroke="#187769" stroke-width="3"/><text x="690" y="327" text-anchor="start" fill="#172033" font-size="17" font-weight="720">acks=all</text><text x="1070" y="327" text-anchor="end" fill="#187769" font-size="14" font-weight="700">current ISR</text><text x="690" y="348" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">subject to min.insync.replicas</text><rect x="668" y="384" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="690" y="409" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Typical setup</text><text x="1070" y="409" text-anchor="end" fill="#187769" font-size="14" font-weight="700">RF=3 · min ISR=2</text><text x="690" y="430" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">critical order events</text><rect x="668" y="466" width="424" height="58" rx="7" fill="#fff" stroke="#b8bbc1" stroke-width="2"/><text x="690" y="491" text-anchor="start" fill="#172033" font-size="17" font-weight="720">Still separate</text><text x="1070" y="491" text-anchor="end" fill="#187769" font-size="14" font-weight="700">Consumer work</text><text x="690" y="512" text-anchor="start" fill="#5c6069" font-size="13" font-weight="550">warehouse action is not confirmed</text></g></g></svg>