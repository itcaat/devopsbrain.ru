<svg xmlns="http://www.w3.org/2000/svg" width="960" height="334" viewBox="0 177 1200 417" role="img" aria-labelledby="title desc">
  <title id="title">A Partition is an append-only log</title>
  <desc id="desc">Order events occupy consecutive offsets, and a new event is appended to the end without moving older records.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">


    <g filter="url(#shadow)">
      <rect x="70" y="214" width="1060" height="340" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="70" y="214" width="1060" height="48" rx="8" fill="#172033"/>
      <text x="98" y="246" fill="#fff" font-size="17" font-weight="750">TOPIC · orders.events · PARTITION 0</text>
      <text x="1098" y="246" text-anchor="end" fill="#c8ced8" font-size="13" font-weight="650">ordered log</text>
      <g fill="#fff" stroke-width="3">
        <rect x="106" y="320" width="190" height="118" rx="7" stroke="#a70d18"/><rect x="316" y="320" width="190" height="118" rx="7" stroke="#275d91"/><rect x="526" y="320" width="190" height="118" rx="7" stroke="#187769"/><rect x="736" y="320" width="190" height="118" rx="7" stroke="#275d91"/>
      </g>
      <g fill="#172033" font-size="17" font-weight="720" text-anchor="middle"><text x="201" y="365">OrderCreated</text><text x="411" y="365">PaymentCompleted</text><text x="621" y="365">DeliveryStarted</text><text x="831" y="365">OrderDelivered</text></g>
      <g fill="#6a6862" font-size="13" font-weight="650" text-anchor="middle"><text x="201" y="397">offset 0</text><text x="411" y="397">offset 1</text><text x="621" y="397">offset 2</text><text x="831" y="397">offset 3</text><text x="201" y="420">orderId 48291</text><text x="411" y="420">orderId 48291</text><text x="621" y="420">orderId 48291</text><text x="831" y="420">orderId 48291</text></g>
      <text x="988" y="394" text-anchor="middle" fill="#a70d18" font-size="42" font-weight="700">→</text>
      <g><rect x="1052" y="340" width="46" height="78" rx="6" fill="#f3e5e4" stroke="#a70d18" stroke-width="2.5" stroke-dasharray="7 5"/><text x="1075" y="369" text-anchor="middle" fill="#a70d18" font-size="12" font-weight="750">NEW</text><text x="1075" y="395" text-anchor="middle" fill="#a70d18" font-size="12" font-weight="750">4</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></g>

      <text x="602" y="503" text-anchor="middle" fill="#5c6069" font-size="17">append at the end · no insertion · no in-place update</text>
    </g>
  </g>
</svg>
