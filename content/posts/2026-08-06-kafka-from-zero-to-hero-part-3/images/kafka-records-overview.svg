<svg xmlns="http://www.w3.org/2000/svg" width="960" height="509" viewBox="0 0 1200 636" role="img" aria-labelledby="title desc">
  <title id="title">Kafka records and offsets</title>
  <desc id="desc">A producer creates a record, Kafka appends it to a partition log, and a consumer tracks its reading position with an offset.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a70d18"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect width="1200" height="800" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="60" y="88" fill="#172033" font-size="52" font-weight="760">Kafka: <tspan fill="#a70d18">Record, Offset &amp; Log</tspan></text>












  <g transform="translate(0 -88)"><g filter="url(#shadow)">
      <rect x="64" y="286" width="250" height="238" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="64" y="286" width="250" height="46" rx="8" fill="#a70d18"/>
      <text x="189" y="317" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">PRODUCER RECORD</text>
      <text x="94" y="375" fill="#172033" font-size="18" font-weight="720">Key</text><text x="284" y="375" text-anchor="end" fill="#a70d18" font-size="18" font-weight="750">48291</text>
      <text x="94" y="413" fill="#172033" font-size="18" font-weight="720">Value</text><text x="284" y="413" text-anchor="end" fill="#5c6069" font-size="15">PaymentCompleted</text>
      <text x="94" y="451" fill="#172033" font-size="18" font-weight="720">Timestamp</text><text x="284" y="451" text-anchor="end" fill="#5c6069" font-size="16">12:00</text>
      <text x="94" y="489" fill="#172033" font-size="18" font-weight="720">Headers</text><text x="284" y="489" text-anchor="end" fill="#5c6069" font-size="16">traceId</text>
    </g><path d="M314 405H418" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#arrow)" opacity=".55"/><rect x="420" y="340" width="190" height="130" rx="8" fill="#fffdfa" stroke="#275d91" stroke-width="3" filter="url(#shadow)"/><text x="515" y="389" text-anchor="middle" fill="#275d91" font-size="16" font-weight="750">PARTITIONER</text><text x="515" y="425" text-anchor="middle" fill="#172033" font-size="22" font-weight="720">Key → P2</text><path d="M610 405H694" fill="none" stroke="#a70d18" stroke-width="4" marker-end="url(#arrow)" opacity=".55"/><g filter="url(#shadow)">
      <rect x="696" y="238" width="438" height="334" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="696" y="238" width="438" height="48" rx="8" fill="#172033"/>
      <text x="722" y="270" fill="#fff" font-size="17" font-weight="750">PARTITION 2 · APPEND-ONLY LOG</text>
      <g fill="#fff" stroke-width="2.5">
        <rect x="730" y="330" width="80" height="86" rx="6" stroke="#8c94a3"/><rect x="826" y="330" width="80" height="86" rx="6" stroke="#8c94a3"/><rect x="922" y="330" width="80" height="86" rx="6" stroke="#8c94a3"/><rect x="1018" y="330" width="80" height="86" rx="6" stroke="#a70d18"/>
      </g>
      <g fill="#172033" font-size="18" font-weight="750" text-anchor="middle"><text x="770" y="367">A</text><text x="866" y="367">B</text><text x="962" y="367">C</text><text x="1058" y="367">D</text></g>
      <g fill="#6a6862" font-size="12" font-weight="650" text-anchor="middle"><text x="770" y="397">offset 0</text><text x="866" y="397">offset 1</text><text x="962" y="397">offset 2</text><text x="1058" y="397">offset 3</text></g>
      <text x="914" y="486" text-anchor="middle" fill="#a70d18" font-size="18" font-weight="750">APPEND →</text>
      <text x="914" y="514" text-anchor="middle" fill="#5c6069" font-size="17">new records extend the history</text>
    </g><g transform="translate(696 610)">
      <text x="0" y="0" fill="#275d91" font-size="15" font-weight="750">CONSUMER POSITION</text>
      <path d="M0 34H438" stroke="#c8d9e8" stroke-width="9" stroke-linecap="round"/>
      <circle cx="292" cy="34" r="12" fill="#275d91" stroke="#fff" stroke-width="3"/>
      <text x="292" y="70" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">next offset: 3</text>
    </g></g></g>
</svg>
