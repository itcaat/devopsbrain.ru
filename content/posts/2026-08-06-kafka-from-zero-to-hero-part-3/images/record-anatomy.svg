<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Inside a Kafka Record</title>
  <desc id="desc">A Kafka record carries a key, value, timestamp, and headers with distinct responsibilities.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#d9d6cf" opacity=".42"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="700" fill="#f8f6f1"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="60" y="82" fill="#172033" font-size="48" font-weight="760">Inside a <tspan fill="#a70d18">Kafka Record</tspan></text>
    <text x="62" y="122" fill="#5c6069" font-size="21">Business payload, routing information, time, and transport metadata</text>
    <g filter="url(#shadow)">
      <rect x="70" y="196" width="1060" height="420" rx="8" fill="#fffdfa" stroke="#a70d18" stroke-width="3"/>
      <rect x="70" y="196" width="1060" height="48" rx="8" fill="#172033"/>
      <text x="98" y="228" fill="#fff" font-size="17" font-weight="750">RECORD · ORDER PAYMENT</text>
      <g>
        <rect x="110" y="286" width="220" height="252" rx="8" fill="#fff7f5" stroke="#a70d18" stroke-width="3"/>
        <text x="140" y="330" fill="#a70d18" font-size="16" font-weight="750">KEY</text><text x="140" y="378" fill="#172033" font-size="31" font-weight="760">48291</text><text x="140" y="419" fill="#5c6069" font-size="16">selects a Partition</text><text x="140" y="449" fill="#5c6069" font-size="16">and preserves order</text>
      </g>
      <g>
        <rect x="350" y="286" width="300" height="252" rx="8" fill="#f5f8fb" stroke="#275d91" stroke-width="3"/>
        <text x="380" y="330" fill="#275d91" font-size="16" font-weight="750">VALUE</text><text x="380" y="372" fill="#172033" font-size="19" font-weight="720">orderId: 48291</text><text x="380" y="407" fill="#172033" font-size="19" font-weight="720">status: paid</text><text x="380" y="442" fill="#172033" font-size="19" font-weight="720">price: 4999</text><text x="380" y="496" fill="#5c6069" font-size="16">the business payload</text>
      </g>
      <g>
        <rect x="670" y="286" width="200" height="252" rx="8" fill="#f1f8f6" stroke="#187769" stroke-width="3"/>
        <text x="700" y="330" fill="#187769" font-size="16" font-weight="750">TIMESTAMP</text><text x="700" y="378" fill="#172033" font-size="25" font-weight="760">12:00</text><text x="700" y="419" fill="#5c6069" font-size="16">Producer time</text><text x="700" y="449" fill="#5c6069" font-size="16">or Broker time</text>
      </g>
      <g>
        <rect x="890" y="286" width="200" height="252" rx="8" fill="#fff" stroke="#8c94a3" stroke-width="3"/>
        <text x="920" y="330" fill="#6a6862" font-size="16" font-weight="750">HEADERS</text><text x="920" y="378" fill="#172033" font-size="18" font-weight="720">traceId</text><text x="920" y="413" fill="#172033" font-size="18" font-weight="720">content-type</text><text x="920" y="448" fill="#172033" font-size="18" font-weight="720">requestId</text><text x="920" y="496" fill="#5c6069" font-size="16">service metadata</text>
      </g>
      <text x="600" y="581" text-anchor="middle" fill="#5c6069" font-size="17">Kafka stores bytes and metadata; applications define their meaning</text>
    </g>
  </g>
</svg>
