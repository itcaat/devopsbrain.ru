<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kafka partition offsets diagram</title>
  <desc id="desc">Each Kafka partition has its own independent offset sequence starting at zero.</desc>
  <defs>
    <style>
      .label {
        fill: #232321;
        font-family: "Fira Sans", "Inter", "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0;
      }
      .mono {
        fill: #232321;
        font-family: "Roboto Mono", "IBM Plex Mono", monospace;
        font-weight: 500;
        letter-spacing: 0;
      }
      .soft-line {
        fill: none;
        stroke: #6f746c;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .partition {
        fill: #f3eee5;
        stroke-width: 5;
      }
      .offset {
        fill: #ffffff;
        stroke-width: 4;
      }
    </style>
    <filter id="paper-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#232321" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#f7f4ed"/>
  <rect x="72" y="68" width="1392" height="888" rx="28" fill="#fbfaf5" stroke="#ded8ca" stroke-width="2"/>

  <text x="768" y="138" text-anchor="middle" class="label" font-size="56">Offsets are per partition</text>
  <text x="768" y="188" text-anchor="middle" class="mono" font-size="26" fill="#6f746c">each partition has its own sequence</text>

  <g>
    <rect x="250" y="272" width="430" height="470" rx="14" class="partition" stroke="#8b2d2b" filter="url(#paper-shadow)"/>
    <path d="M 286 310 H 644 M 286 704 H 644" class="soft-line" stroke-dasharray="14 16"/>
    <text x="465" y="360" text-anchor="middle" class="label" font-size="40">Partition 0</text>

    <rect x="326" y="438" width="278" height="72" rx="9" class="offset" stroke="#8b2d2b" filter="url(#paper-shadow)"/>
    <rect x="326" y="536" width="278" height="72" rx="9" class="offset" stroke="#3f6f87" filter="url(#paper-shadow)"/>
    <rect x="326" y="634" width="278" height="72" rx="9" class="offset" stroke="#5f7b54" filter="url(#paper-shadow)"/>

    <text x="465" y="483" text-anchor="middle" class="mono" font-size="28">Offset 0</text>
    <text x="465" y="581" text-anchor="middle" class="mono" font-size="28">Offset 1</text>
    <text x="465" y="679" text-anchor="middle" class="mono" font-size="28">Offset 2</text>
  </g>

  <g>
    <rect x="856" y="272" width="430" height="470" rx="14" class="partition" stroke="#3f6f87" filter="url(#paper-shadow)"/>
    <path d="M 892 310 H 1250 M 892 704 H 1250" class="soft-line" stroke-dasharray="14 16"/>
    <text x="1071" y="360" text-anchor="middle" class="label" font-size="40">Partition 1</text>

    <rect x="932" y="438" width="278" height="72" rx="9" class="offset" stroke="#8b2d2b" filter="url(#paper-shadow)"/>
    <rect x="932" y="536" width="278" height="72" rx="9" class="offset" stroke="#3f6f87" filter="url(#paper-shadow)"/>
    <rect x="932" y="634" width="278" height="72" rx="9" class="offset" stroke="#5f7b54" filter="url(#paper-shadow)"/>

    <text x="1071" y="483" text-anchor="middle" class="mono" font-size="28">Offset 0</text>
    <text x="1071" y="581" text-anchor="middle" class="mono" font-size="28">Offset 1</text>
    <text x="1071" y="679" text-anchor="middle" class="mono" font-size="28">Offset 2</text>
  </g>

  <g>
    <rect x="414" y="798" width="708" height="72" rx="10" fill="#ffffff" stroke="#ded8ca" stroke-width="3"/>
    <text x="768" y="844" text-anchor="middle" class="mono" font-size="24">Offset numbers repeat across different partitions</text>
  </g>

  <path d="M 188 910 H 1348" class="soft-line" stroke-dasharray="8 18"/>
</svg>
